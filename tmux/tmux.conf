# tmux: the configuration shared by every machine. install.sh links it to
# ~/.config/tmux/tmux.conf, so a git pull updates it. Made for tmux 3.5 or later.
# tmux draws with the sixteen colours of the terminal, so it wears the colour scheme of the
# terminal, whichever it is. Only the name of the session sits in the blue of the Starship prompt.
# After a change: tmux source-file ~/.config/tmux/tmux.conf

# ── What the terminal can do ─────────────────────────────────────────────────────────────────
# tmux learns it from TERM. These lines add what the description of the terminal does not say:
# full colour, links, updates drawn in one piece, the clipboard, modified keys, focus, and
# underlines with a style. They are for Ghostty and for terminals that say xterm-256color.
set -s  default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:sync:clipboard:extkeys:focus:usstyle"
set -as terminal-features ",xterm-256color:RGB:hyperlinks:sync:clipboard:extkeys:focus:usstyle"

# A copy made in tmux, or by a program inside it, reaches the clipboard of the desktop.
set -s  set-clipboard on

# Programs inside tmux tell Shift+Enter from Enter, and see when their pane gets the keyboard.
set -s  extended-keys on
set -s  extended-keys-format csi-u
set -s  focus-events on

# Pictures and other sequences that tmux does not know go through to the terminal.
set -g  allow-passthrough on

# ── Everyday ─────────────────────────────────────────────────────────────────────────────────
set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
set -g  renumber-windows on

# ── The status line ──────────────────────────────────────────────────────────────────────────
# Quiet: dim text on the background of the terminal, the session in a blue pill at the left, the
# current window in blue, the clock at the right.
set -g  status-style "bg=default,fg=colour8"
set -g  status-left-length 30
set -g  status-left "#[fg=#82AAFF]#[bg=#82AAFF,fg=#1E2030] #S #[bg=default,fg=#82AAFF] "
set -g  window-status-format " #I #W "
set -g  window-status-current-format "#[fg=colour4,bold] #I #W "
set -g  status-right "#[fg=colour8]%H:%M "

# ── Panes and the copy mode ──────────────────────────────────────────────────────────────────
set -g  pane-border-style "fg=colour8"
set -g  pane-active-border-style "fg=colour4"
set -g  mode-style "bg=colour4,fg=colour0"
