# ~/.claude/statusline.conf — knobs for ~/.claude/statusline-command.sh (bash syntax)
# Preview any change:  bash ~/.claude/statusline-command.sh --demo [nerd|emoji|unicode] [COLUMNS]

ICONS=auto        # auto | nerd | emoji | unicode   (auto → nerd when a Nerd Font is installed)
THEME=auto        # auto | light | dark            (auto follows the Claude Code theme)
LINES=3           # 1 = identity only, 2 = + telemetry HUD, 3 = + system line
RESPONSIVE=1      # drop / shrink segments automatically on narrow terminals

SHOW_GIT=1        # branch, ●staged ✚modified …untracked ✖conflicts ⇡ahead ⇣behind ⚑stash, worktree
SHOW_PR=1         # open pull / merge request for the branch (clickable)
SHOW_ENV=1        # python venv + version, typst / rust / julia / tex / node detection
SHOW_REPO=1       # owner/name of the remote repository
SHOW_CACHE=1      # prompt-cache warmth, hit ratio, time to expiry
SHOW_RATE=1       # 5-hour / 7-day / spend-limit gauges with reset times
SHOW_SYSTEM=1     # load / memory / cpu (since last refresh) / battery
SHOW_HOST=1       # user@host, claude version, thinking / fast / vim / agent flags
SHOW_SESSION=1    # session name
SHOW_CLOCK=1      # wall clock

GAUGE_W=10        # context gauge width
RATE_W=5          # rate-limit gauge width
GIT_TIMEOUT=0.6   # seconds; git status is skipped when the repo is slower than this
GIT_CACHE=4       # seconds to reuse the last git status between refreshes
